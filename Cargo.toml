[package]
rust-version = "1.70"
readme = "README.md"
name = "dial-ecology"
version = "0.1.0"
edition = "2024"
description = "Ecological succession on the cultural dial: traditions compete like species for niche space, governed by Lotka-Volterra dynamics"
license = "MIT"
