documentation = "https://docs.rs/dial-ecology"
keywords = ["ecology", "lotka-volterra", "cultural-dynamics", "succession", "biodiversity"]
categories = ["science", "simulation"]

[dependencies]
serde = { version = "1", features = ["derive"] }
